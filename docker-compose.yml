services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yeet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yeet}
      POSTGRES_DB: ${POSTGRES_DB:-yeet}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yeet}:${POSTGRES_PASSWORD:-yeet}@db:5432/${POSTGRES_DB:-yeet}
      CORS_ORIGINS: '["http://localhost:5173"]'
      APP_ENV: ${APP_ENV:-local}
      AUTH_MODE: ${AUTH_MODE:-dev}
      STYTCH_PROJECT_ID: ${STYTCH_PROJECT_ID:-}
      STYTCH_ENV: ${STYTCH_ENV:-test}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_STYTCH_PUBLIC_TOKEN: ${STYTCH_PUBLIC_TOKEN:-}
      VITE_STYTCH_SESSION_MINUTES: ${STYTCH_SESSION_MINUTES:-60}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
